name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo test --workspace

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Generator-drift gate: every regression-corpus entry must still rebuild from
  # its own recipe to a byte-identical kernel. Needs no analyzer, so it runs
  # here; analyzer drift needs a pinned nightly and a built cargo-reconverge,
  # and runs locally as `just regress`.
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: ./scripts/check-corpus.sh

  # macOS is where this laboratory is actually operated, so it is gated too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Materialize pinned toolchain
        run: |
          rustup toolchain install
          rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The single required status check: green iff every Linux gate is green.
  required-green:
    name: required-green
    if: always()
    needs: [fmt, clippy, test, docs, deny, corpus]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every gate succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a required gate did not succeed" >&2
              exit 1
            fi
          done
