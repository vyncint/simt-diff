name: scan

# Continuous scan of the analyzer under test.
#
# The regression corpus records nine observations of reconverge's behaviour, each
# with the version it was measured against. This workflow rebuilds reconverge
# hourly against the newest *published* version and re-runs them. A signature
# that moves is the whole point of the corpus existing: it means the analyzer
# changed, and the change is either news to celebrate or news to file.
#
# A release rather than `main`, for one reason that matters: a version is a name.
# "0.1.12 promotes this and 0.1.6 did not" is a claim anyone can check years from
# now; "main did, on a Tuesday" is not. Corpus entries record the version they
# were measured against, so the target has to be nameable in the same terms. A
# git ref stays available on manual dispatch, for investigating something not yet
# released.
#
# Daily, not hourly. The scan target is the newest *published* reconverge, and
# reconverge publishes about once a month — so an hourly scan spent 730 runs a
# month, 84% of all scheduled CI in the ecosystem, watching for an event that
# happens twelve times a year. 729 of every 730 runs found the same version
# they found an hour earlier.
#
# The cost was never the compute: the analyzer build is cached on reconverge's
# commit, so an unchanged `main` restores it and only the nine entries are
# re-analyzed. The cost is that a workflow firing every hour is a workflow
# nobody reads, and drift is reported as an issue anyway rather than as a run.
#
# A publish should reach here as an event, not as a poll — `repository_dispatch`
# below is exactly that, and the tool repos have a `notify-testing-repo` job for
# it. It needs `TESTING_REPO_DISPATCH_TOKEN`, which is not set on any of them,
# so this schedule is currently the only thing that keeps the corpus current.
# Once the token exists, daily becomes a safety net rather than the mechanism.
#
# The fast, sharp signal lives here. The full launch matrix is weekly, in
# scan-matrix.yml, because it costs twenty minutes rather than one.

on:
  schedule:
    # Offset from the top of the hour: :00 is the most contended slot on
    # GitHub's scheduler, and a delayed scan is a scan that reports late.
    - cron: "28 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: published version to scan, or "latest"
        required: false
        default: latest
      ref:
        description: git ref to scan instead of a published version
        required: false
        default: ""
  # So a reconverge release can trigger a scan the moment it lands, instead of
  # waiting out the rest of the hour:
  #   gh api repos/vyncint/simt-diff/dispatches -f event_type=tool-published
  repository_dispatch:
    types: [tool-published]

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  regress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: analyzer
        uses: ./.github/actions/analyzer
        with:
          version: ${{ inputs.version || 'latest' }}
          ref: ${{ inputs.ref || '' }}

      - name: Materialize this repository's toolchain
        run: |
          rustup toolchain install
          rustup show

      # Generator drift first: if our own recipes stopped rebuilding, every
      # signature below would be about a different program and the scan would
      # report analyzer drift that does not exist.
      - name: Generator drift
        run: ./scripts/check-corpus.sh

      - name: Analyzer drift
        id: regress
        env:
          SIMT_DIFF_RECONVERGE: ${{ steps.analyzer.outputs.bin }}
          SIMT_DIFF_RECONVERGE_VERSION: ${{ steps.analyzer.outputs.version }}
        run: |
          set +e
          cargo run --quiet -p simt-diff -- regress --out "$RUNNER_TEMP/cases" > regress.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat regress.txt

      - name: Summarize
        if: always()
        env:
          SOURCE: ${{ steps.analyzer.outputs.source }}
          VERSION: ${{ steps.analyzer.outputs.version }}
        run: |
          {
            echo "## Scan of reconverge $SOURCE"
            echo
            echo '```'
            tail -n 40 regress.txt 2>/dev/null || echo "no regress output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regress-${{ steps.analyzer.outputs.version }}
          path: regress.txt
          if-no-files-found: warn

      # One issue per drifting commit, not one per scheduled run: a scan that
      # files the same report every morning trains its reader to ignore it.
      - name: File drift
        if: steps.regress.outputs.exit != 'exit=0' && steps.regress.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE: ${{ steps.analyzer.outputs.source }}
          VERSION: ${{ steps.analyzer.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="scan: corpus drift against reconverge $VERSION"
          if gh issue list --repo "$REPO" --state all --search "\"$VERSION\" in:title" --json title --jq '.[].title' | grep -qF "$title"; then
            echo "already filed for $VERSION"
            exit 0
          fi
          {
            echo "A scheduled scan found a recorded observation that no longer holds."
            echo
            echo "- analyzer under test: \`$SOURCE\`"
            echo "- run: $RUN"
            echo
            echo "\`ANALYZER DRIFT\` means the same program now gets a different answer, which is"
            echo "what the corpus exists to catch. \`GENERATOR DRIFT\` would mean this repository"
            echo "changed instead — the generator gate ran first and passed, so that is unlikely here."
            echo
            echo '```'
            cat regress.txt
            echo '```'
            echo
            echo "Next: decide per entry whether the new behaviour is an improvement (re-record"
            echo "the entry and say why in the PR) or a regression (file it upstream with the"
            echo "packaged reproducer)."
          } > body.md
          gh issue create --repo "$REPO" --title "$title" --label corpus-drift --body-file body.md
