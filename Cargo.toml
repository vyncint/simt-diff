[workspace]
resolver = "3"
members = ["crates/simt-diff"]
# Generated artifacts that contain their own manifests: emitted case crates and
# packaged reproducers are programs *under test*, never workspace members.
exclude = ["cases", "reproducers"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vyncint/simt-diff"
# A laboratory, not a library: nothing here is meant to be depended on, and a
# published version number would imply a stability promise this does not make.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
