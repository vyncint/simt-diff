# Dependency policy (CONTRIBUTING.md). Adding a dependency whose license is
# outside this allowlist is a stop-and-ask event, never a quiet config edit.
#
# This workspace has two dependencies on purpose. SHA-256 is vendored rather
# than pulled in (crates/simt-diff/src/templates.rs) because case identity has
# to stay stable for the life of the corpus, and that is forty lines.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
# The allowlist is policy, not a mirror of the current tree: entries stay
# listed even while no dependency uses them yet.
unused-allowed-license = "allow"

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
# Every workspace dependency comes from crates.io. The *generated* case crates
# do carry a git dependency on cuda-oxide — that is the program under test, it
# is pinned by revision, and it is never a dependency of this workspace.
unknown-git = "deny"
